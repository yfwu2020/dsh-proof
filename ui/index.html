<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PROOF</title>
<link rel="stylesheet" href="app.css">
<script>(function(){try{var q=new URLSearchParams(location.search).get("theme");var t=q||localStorage.getItem("pocket-theme");if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t);if(q)localStorage.setItem("pocket-theme",q);}catch(e){}})();</script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><b>PROOF</b><span>本地原型工作台</span></div>
    <nav class="nav">
      <a class="on" href="index.html">首页</a>
      <a href="projects.html">全部项目</a>
      <a href="design.html">规范</a>
    </nav>
    <button class="themebtn" id="themeBtn" aria-label="切换主题"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <div class="status"><span class="dot"></span><span>本地 · :8321</span></div>
  </div>

  <section class="pagehead">
    <div>
      <div class="eyebrow">工作台</div>
      <h1>发过来的东西，<br>都在这台 iPad 上。</h1>
      <p class="lede">网页、图片、构建好的程序 —— 说一句就送过来，按类型归好类，随时能打开。</p>
    </div>
  </section>

  <div class="panel" style="max-width:520px">
    <div class="k">当前状态</div>
    <div class="kv"><span>项目</span><b id="stat-projects">—</b></div>
    <div class="kv"><span>文件</span><b id="stat-files">—</b></div>
    <div class="kv"><span>占用</span><b id="stat-size">—</b></div>
    <div class="kv"><span>最近发送</span><b id="stat-latest">—</b></div>
  </div>

  <div class="sec-head"><h3>按类型</h3><span style="font-size:12px;color:var(--muted)">点分类进文件列表</span></div>
  <div class="filters" id="kinds"></div>

  <div class="sec-head"><h3>最近发送</h3><a href="projects.html">全部项目</a></div>
  <div class="grid" id="recent"></div>

  <div class="foot">
    <div>访问地址 <code id="addr">—</code><br>
      数据更新时间 <code id="updated">—</code></div>
    <div style="text-align:right">PROOF · 本地原型工作台<br>
      <span style="font-family:var(--mono);font-size:11px">home-v3</span></div>
  </div>

</div>

<script src="app.js"></script>
<script src="data.js"></script>
<script>
(async function () {
  var data = await loadData();
  var projects = data.projects || [];
  var totals = data.totals || {};

  document.getElementById('addr').textContent = location.origin + '/';
  document.getElementById('updated').textContent = data.updated || '—';
  document.getElementById('stat-projects').textContent = projects.length;
  document.getElementById('stat-files').textContent = projects.reduce(function (s, p) { return s + p.count; }, 0);
  document.getElementById('stat-size').textContent = fmtBytes(projects.reduce(function (s, p) { return s + p.bytes; }, 0));
  document.getElementById('stat-latest').textContent = projects.length ? fmtAgo(projects[0].ts) : '—';

  var order = ['web', 'image', 'video', 'doc', 'asset', 'file'];
  document.getElementById('kinds').innerHTML = order.filter(function (k) { return totals[k]; }).map(function (k) {
    return '<a class="chip" href="files.html?kind=' + k + '">' + icon(k, 13) + ' ' + kindLabel(k) +
      ' <span style="opacity:.6">' + totals[k] + '</span></a>';
  }).join('') || '<span style="color:var(--muted);font-size:13px">还没有发送过任何东西</span>';

  var recent = document.getElementById('recent');
  if (!projects.length) {
    recent.innerHTML = '<div class="panel"><div class="k">空</div><p class="lede" style="font-size:14px;margin:0">在 Mac 上说「把这个发到 iPad」，或调用 <code style="font-family:var(--mono);font-size:12px">proof_send {"source":"<路径>"}</code></p></div>';
    return;
  }
  recent.innerHTML = projects.slice(0, 6).map(function (p) {
    return '<a class="card" href="project.html?p=' + encodeURIComponent(p.slug) + '">' +
      '<div class="thumb" style="display:flex;align-items:center;justify-content:center">' + icon(p.kind, 30) + '</div>' +
      '<div class="name">' + esc(title(p.name)) + '</div>' +
      '<div class="desc">' + kindLabel(p.kind) + ' · ' + p.count + ' 个文件</div>' +
      (p.broken ? '<div class="tags" style="display:flex;gap:6px"><span class="chip acc">链接失效</span></div>' : '') +
      '<div class="meta"><span>' + fmtAgo(p.ts) + '</span><span>' + fmtBytes(p.bytes) + '</span></div>' +
    '</a>';
  }).join('');
})();
</script>
</body>
</html>
